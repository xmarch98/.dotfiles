#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = wl-clipboard
exec-once = hyprsunset -t 5000
exec-once = hypridle
exec-once = hyprctl setcursor Bibata 24

