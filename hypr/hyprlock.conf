source = /home/justin/.cache/wal/colors-hyprland.conf

$DISPLAY=DP-1
$DISPLAY2=DP-2
$FONT=VictorMono
$FONT_BOLD=VictorMono SemiBold
$FONT_COLOUR_BG=rgb(206, 212, 218)
$FONT_COLOUR=rgb(222, 226, 230)

# BACKGROUND
background {
    monitor = $DISPLAY
    #path = screenshot
    path = /home/justin/Pictures/wal.png
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

background {
    monitor = $DISPLAY2
    #path = screenshot
    path = /home/justin/Pictures/wal.png
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    ignore_empty_input = true
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor = $DISPLAY
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(173, 181, 189) #ADB5BD
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgb(222, 226, 230) #DEE2E6
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <span foreground="##E9ECEF">oops! try again</span>
    fail_transition = 0
    capslock_color = -1
    numlock_color = -1
    placeholder_text = <i><span foreground="##ADB5BD">password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor = $DISPLAY
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = $FONT
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = $DISPLAY
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = $FONT_BOLD
  position = 0, 200
  halign = center
  valign = center
}



# Profile Picture
image {
    monitor = $DISPLAY
    path = /home/justin/Pictures/profile_pictures/justin_square.png
    size = 100
    border_size = 2
    border_color = $foreground
    position = 0, -100
    halign = center
    valign = center
}

# Desktop Environment
image {
    monitor = $DISPLAY
    path = /home/justin/Pictures/profile_pictures/hypr.png
    size = 75
    border_size = 2
    border_color = $foreground
    position = -50, 50
    halign = right
    valign = bottom
}

# CURRENT SONG
label {
    monitor = $DISPLAY
    text = cmd[update:1000] echo "$(/home/justin/Documents/Scripts/whatsong.sh)" 
    color = $foreground
    #color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = Metropolis Light, Font Awesome 6 Free Solid
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor = $DISPLAY
    text = cmd[update:1000] echo "$(/home/justin/Documents/Scripts/whoami.sh)"
    color = $foreground
    font_size = 14
    font_family = $FONT
